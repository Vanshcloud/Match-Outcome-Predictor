name: CI

# Runs exactly the gates `make quality` and `make test-cov` run locally. A CI
# that checks something different from the local command is a CI that people
# learn to re-run rather than read.
#
# It also runs on a clean checkout, where data/ and models/ are empty. Keeping
# the suite green there is the property this workflow exists to protect: a
# suite that only passes on a machine which has already downloaded 250k
# matches is a suite nobody can trust.

# Least privilege. Nothing here publishes, comments or tags, so GITHUB_TOKEN
# gets read access and nothing else rather than the repository default.
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The same minor the project develops against. A silent 3.14 would
          # change behaviour with no diff to point at.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src api dashboard tests scripts

      - name: Format check
        run: black --check src api dashboard tests scripts

      - name: Types
        run: mypy src api dashboard

      - name: Leakage suite
        # Every producer in the codebase, found by walking the packages rather
        # than by reading a list, probed before anything else runs. Split out
        # from the step below so a leak is named in the job list instead of
        # being one dot among five hundred.
        run: pytest tests/unit/test_leakage_suite.py -q

      - name: Tests
        # Integration tests are excluded by marker AND would skip anyway on a
        # clean checkout. Both, so a forgotten marker cannot quietly turn a
        # skip into a failure.
        #
        # --cov-fail-under is what keeps the README's coverage claim honest.
        # Without it the number in the README is prose, not a measurement.
        run: pytest -m "not integration" --cov=src --cov=api --cov=dashboard --cov-report=term-missing --cov-fail-under=100

      - name: Confirm the suite is green with no data present
        # `test ! -d` would prove nothing here: a Parquet file is a *file*, so
        # -d is false whether or not the data is there. -e covers both, and the
        # loop names the offending file instead of failing with a bare code.
        run: |
          set -e
          for path in data/raw data/processed data/features data/reports models; do
            count=$(find "$path" -type f -not -name '.gitkeep' | wc -l | tr -d ' ')
            if [ "$count" -ne 0 ]; then
              echo "expected $path to be empty on a clean checkout; found $count file(s):"
              find "$path" -type f -not -name '.gitkeep'
              exit 1
            fi
          done
          echo "clean checkout confirmed: data/ and models/ empty, suite passed"

  authorship:
    name: Authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: No AI attribution in commit history
        # scripts/hooks/commit-msg enforces this at commit time, but a hook
        # only runs where someone has run `make hooks` — never on a fork, and
        # never on a clone that skipped setup.
        run: |
          trailers=$(git log --format='%(trailers:key=Co-Authored-By)' | grep -c . || true)
          if [ "$trailers" -ne 0 ]; then
            echo "found $trailers Co-Authored-By trailer(s)"; exit 1
          fi
          # Anchored to line start: an attribution is a trailer or its own
          # line, never a mid-sentence mention. Without the anchor this fails
          # on the commit that adds the hook's own test cases — a false
          # positive that would teach people to ignore this job.
          if git log --format='%B' | grep -qiE '^(co-authored-by:|generated with )'; then
            echo "found an AI attribution line in a commit message"; exit 1
          fi
          echo "authorship clean: $(git log --oneline | wc -l) commits"

      - name: One author across the history
        run: |
          expected="vanshwar@gmail.com"
          unexpected=$(git log --format='%ae%n%ce' | sort -u | grep -v "^${expected}$" || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected author or committer address:"; echo "$unexpected"; exit 1
          fi
          echo "single author across $(git rev-list --count HEAD) commits"

      - name: No host-specific detail anywhere in the history
        # A redaction commit does not redact anything: the text survives in
        # every earlier commit, and the removing diff prints it again in its
        # own '-' lines. This has to read `git log -p`, because a tip-only
        # check is exactly the check that misses it.
        run: |
          if git log -p --all | grep -nEi '/(Users|home)/[a-z0-9._-]+/|[0-9]+ ?GB free'; then
            echo "a local path or host inventory appears in the history"; exit 1
          fi
          echo "no host-specific detail in the history"

  invariants:
    name: Architectural invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No removed or deprecated APIs
        # Each of these still *runs* and merely warns, which is why a grep is
        # worth more here than a code review. The list grows as milestones
        # introduce the libraries that have them.
        #
        # Every pattern is anchored to CODE, never to prose. The unanchored
        # version failed on src/utils/config.py's own docstring — the one
        # explaining which v1 idioms are banned. A gate that goes red for
        # documenting the rule it enforces is a gate people disable.
        run: |
          set -e
          patterns='^[[:space:]]*@(app\.on_event|validator|root_validator)\b'
          patterns="$patterns"'|[A-Za-z0-9_)][[:space:]]*\.(parse_obj|dict)\(\)'
          patterns="$patterns"'|^[[:space:]]*class Config:'
          if grep -rEn "$patterns" src api tests scripts 2>/dev/null; then
            echo "found a removed or deprecated API above"; exit 1
          fi
          echo "no removed APIs in use"

      - name: utils depends on nothing else in src
        # src/utils is the bottom of the dependency graph. Keeping it there is
        # what lets every other package import it without a cycle, and a cycle
        # is far cheaper to prevent than to unpick later.
        #
        # Two greps rather than one with a negative lookahead: `(?!...)` is
        # PCRE, and `grep -E` is POSIX ERE, where it is a syntax error rather
        # than a non-match — so the elegant one-liner fails the job outright.
        #
        # `from src import __version__` is the single permitted exception:
        # src/__init__.py imports nothing, so it cannot create a cycle, and the
        # alternative is a second copy of the version string. It is matched and
        # excluded by name rather than by a pattern loose enough to let a real
        # import through — the first version of this check used `src\.` and
        # would have missed `from src import` entirely.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\b' src/utils \
                      | grep -v 'src\.utils' \
                      | grep -v 'from src import __version__' || true)
          if [ -n "$offenders" ]; then
            echo "src/utils imports another src package:"; echo "$offenders"; exit 1
          fi
          echo "src/utils has no intra-src dependencies"

      - name: The provider stays behind the adapter layer
        # The whole point of src/ingestion is that no downstream module learns
        # which provider a match came from. A provider name or URL leaking into
        # features, models or the API is that abstraction quietly dissolving,
        # and it is far cheaper to catch here than to unpick later.
        run: |
          leaked=$(grep -rEln 'football-data\.co\.uk|mmz4281' src api scripts \
                   | grep -v '^src/ingestion/' || true)
          if [ -n "$leaked" ]; then
            echo "provider details outside src/ingestion:"; echo "$leaked"; exit 1
          fi
          echo "provider confined to src/ingestion"

      - name: The canonical table is read through the storage layer
        # Milestone 3's seam. Every module downstream asks a store for rows
        # rather than opening a path, so the day the matches stop living in a
        # file, a caller that asked a store keeps working and a caller that
        # opened a path has to be rewritten. src/pipelines writes the file, so
        # it is the one package allowed to name the format.
        run: |
          leaked=$(grep -rEln 'read_parquet' src api scripts \
                   | grep -v '^src/storage/' || true)
          if [ -n "$leaked" ]; then
            echo "the canonical table is read outside src/storage:"; echo "$leaked"; exit 1
          fi
          echo "canonical reads confined to src/storage"

      - name: Ratings compute; they do not fetch, store or validate
        # src/ratings sits between utils and the pipelines: it turns a frame
        # into a frame. A rating model that reached for the store would be a
        # model that could not be run on a slice, which is exactly what the
        # causality probes do to it — they hand it truncated frames, and a
        # model that went to disk for the rest would pass every probe while
        # reading the future.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' src/ratings \
                      | grep -vE 'src\.(ratings|utils)\.' || true)
          if [ -n "$offenders" ]; then
            echo "src/ratings depends on more than utils:"; echo "$offenders"; exit 1
          fi
          echo "src/ratings depends only on src.ratings and src.utils"

      - name: Features read the schema; they do not fetch, rate or store
        # src/feature_engineering turns a frame into a frame. It is allowed the
        # canonical schema — that is what a feature reads — and nothing else.
        # A builder that reached for the store or the ratings would be one the
        # causality probes could not test, because they work by handing it
        # truncated frames and a builder that went elsewhere for the rest would
        # pass every probe while reading the future.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' src/feature_engineering \
                      | grep -vE 'src\.(feature_engineering|utils)\.|src\.ingestion\.base' || true)
          if [ -n "$offenders" ]; then
            echo "src/feature_engineering reaches past the schema:"; echo "$offenders"; exit 1
          fi
          echo "src/feature_engineering depends only on the schema and utils"

      - name: Metrics compute; they know nothing about where data comes from
        # src/evaluation is arithmetic over an array and a list of outcomes.
        # A metric that reached for a store or a schema beyond the canonical
        # result labels would be one that could not score a forecast held in
        # memory, which is exactly how every caller here holds one.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' src/evaluation \
                      | grep -vE 'src\.(evaluation|utils)\.|src\.ingestion\.base' || true)
          if [ -n "$offenders" ]; then
            echo "src/evaluation reaches past the schema:"; echo "$offenders"; exit 1
          fi
          echo "src/evaluation depends only on the schema and utils"

      - name: Splits and models take frames; they do not fetch or store
        # A split is a function of a frame and a model is a function of two.
        # That is what lets the boundary probe hand them slices and get a
        # truthful answer — a model that went to disk for the rest of the
        # history would pass every fold check while training on the future.
        #
        # Milestone 8 added `feature_engineering.registry` to the permitted
        # list. It is a schema module like `ingestion.base` and `ratings.base`:
        # the design matrix is *derived* from the feature registry rather than
        # written out again, so a feature added there is a column the zoo sees
        # without anyone editing a second list.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' src/models \
                      | grep -vE 'src\.(models|utils|evaluation|validation)\.|src\.(ingestion|ratings)\.base|src\.feature_engineering\.registry' || true)
          if [ -n "$offenders" ]; then
            echo "src/models reaches past the schema:"; echo "$offenders"; exit 1
          fi
          echo "src/models depends only on schemas, metrics, the probes and utils"

      - name: Explainability reads a model; it does not fetch, store or orchestrate
        # src/explainability turns a fitted model and two frames into a table.
        # It is allowed the zoo (it needs a fitted estimator and the design
        # columns), the metrics (permutation importance is a log loss delta)
        # and the canonical schema. A module here that reached for a store or a
        # pipeline would be one that could not explain a model held in memory,
        # which is how every caller holds one — and it would put the reporting
        # layer underneath the layer that reports it.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' src/explainability \
                      | grep -vE 'src\.(explainability|models|evaluation|utils)\.|src\.ingestion\.base' || true)
          if [ -n "$offenders" ]; then
            echo "src/explainability reaches past the model layer:"; echo "$offenders"; exit 1
          fi
          echo "src/explainability depends only on models, metrics, the schema and utils"

      - name: The API is a caller of src, never a dependency of it
        # The arrow points one way. `src` is the library `make reproduce` runs
        # and it must not learn that a web server exists — the day it does,
        # every pipeline in this project needs FastAPI installed to import, and
        # the leakage suite starts walking a package full of route handlers.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) api\b' src scripts || true)
          if [ -n "$offenders" ]; then
            echo "src imports the api package:"; echo "$offenders"; exit 1
          fi
          echo "api depends on src; src does not depend on api"

      - name: The API reaches no further than the pipeline layer
        # The one shortcut that would undo Milestone 6. A design row is thirty
        # columns built by producers the leakage suite walks and probes;
        # rebuilding one inside a request handler would be a second, unprobed
        # implementation of the feature layer sitting on the request path.
        #
        # So `api` may have the pipelines, the artefact, the storage protocols,
        # the config and the card — and not `src.ratings`,
        # `src.feature_engineering` or `src.ingestion`. The registry names are
        # excluded by name rather than by a loose pattern, for the same reason
        # the `src/utils` check excludes `from src import __version__`.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' api \
                      | grep -vE 'src\.(pipelines|models|storage|utils|evaluation)\.' || true)
          if [ -n "$offenders" ]; then
            echo "api reaches past the pipeline layer:"; echo "$offenders"; exit 1
          fi
          echo "api depends only on pipelines, models, storage, evaluation and utils"

      - name: The dashboard is a client of the service, not a second copy of it
        # Milestone 12. `dashboard` talks to `api` over HTTP and must never
        # import it: the moment it can call a handler directly, "what does the
        # model say" has two implementations in one process and the day they
        # disagree the disagreement is invisible, because nothing compares
        # them. The same rule that keeps a design row off the request path
        # keeps the artefact out of the dashboard.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) api\b' dashboard || true)
          if [ -n "$offenders" ]; then
            echo "the dashboard imports the api package instead of calling it:"; echo "$offenders"; exit 1
          fi
          echo "dashboard calls the service over HTTP; it does not import it"

      - name: Nothing depends on the dashboard
        # It is the top of the graph. `src` is the library `make reproduce`
        # runs and `api` is the process that serves it; either importing a
        # Streamlit page would make the pipelines need Streamlit to start.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) dashboard\b' src api scripts || true)
          if [ -n "$offenders" ]; then
            echo "src, api or scripts imports the dashboard:"; echo "$offenders"; exit 1
          fi
          echo "dashboard depends on src; nothing depends on dashboard"

      - name: The dashboard reads reports; it does not build them
        # It may have the pipelines (the tables), the evaluation layer (the
        # reliability functions the card uses), the model layer (for the
        # shipped model's name) and utils. It may not reach `src.ratings` or
        # `src.feature_engineering` — a dashboard that recomputed a feature
        # would be an unprobed copy of the layer Milestone 6 exists to guard,
        # and one that recomputed a metric would be a second number to
        # reconcile with the model card.
        #
        # Two names from `src.ingestion` are excluded by name, not by a loose
        # pattern: `base` (the canonical schema, already permitted to the
        # models and the metrics for the same reason) and `registry` (the
        # competition catalogue). The registry is a YAML file and the pydantic
        # models that validate it — no provider, no network, no fetch — and it
        # is where a league is *added* to this project. A dashboard with its
        # own copy of the league names would be a second list, and the first
        # league added in a later milestone would be added to one of them.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) src\.' dashboard \
                      | grep -vE 'src\.(pipelines|models|evaluation|utils)\.|src\.ingestion\.(base|registry)' || true)
          if [ -n "$offenders" ]; then
            echo "the dashboard reaches past the reporting layer:"; echo "$offenders"; exit 1
          fi
          echo "dashboard depends only on pipelines, models, evaluation, the schema and utils"

      - name: The dashboard's layers point one way
        # Milestone 12's own shape, and the reason Milestone 13 is one class.
        #
        #   views -> services -> providers -> domain
        #
        # `domain` is the vocabulary — what a match and a forecast are — and it
        # imports none of the three above it, which is what lets a provider, a
        # test and one day a different front end all mean the same thing by a
        # Fixture. `providers` may not reach up into services or views.
        run: |
          set -e
          offenders=$(grep -rEn '^[[:space:]]*(from|import) dashboard\.(providers|services|views)\b' \
                      dashboard/domain || true)
          if [ -n "$offenders" ]; then
            echo "dashboard/domain imports a layer above it:"; echo "$offenders"; exit 1
          fi
          offenders=$(grep -rEn '^[[:space:]]*(from|import) dashboard\.(services|views)\b' \
                      dashboard/providers || true)
          if [ -n "$offenders" ]; then
            echo "dashboard/providers imports a layer above it:"; echo "$offenders"; exit 1
          fi
          offenders=$(grep -rEn '^[[:space:]]*(from|import) dashboard\.views\b' dashboard/services || true)
          if [ -n "$offenders" ]; then
            echo "dashboard/services imports the views:"; echo "$offenders"; exit 1
          fi
          echo "dashboard layers point one way: views -> services -> providers -> domain"

      - name: No view names a provider
        # The property the whole provider layer exists for. A view asks the
        # context for a source and renders whatever answers; it must not import
        # a concrete one, because the day a view does, connecting the next
        # feed stops being one class and becomes a search. Milestone 13
        # connected football-data.org under exactly this rule and moved no
        # view; the module is named here so the rule keeps covering it.
        #
        # `dashboard/context.py` names them because something must, and a
        # service may compose one — that is what a service is. A *view* may
        # not, and that is the line this checks.
        run: |
          offenders=$(grep -rEn '^[[:space:]]*(from|import) dashboard\.providers\.(historical|api|null|football_data_org)\b' \
                      dashboard/views || true)
          if [ -n "$offenders" ]; then
            echo "a view imports a concrete provider:"; echo "$offenders"; exit 1
          fi
          echo "views name no provider; the context and the services do"

      - name: No network access from the unit suite
        # The suite must stay runnable offline, and every outbound request in
        # this project goes through src/utils/http, which owns the timeout, the
        # retry policy and the rate limit.
        #
        # Two greps, because the rule is about *calls* and not about the name.
        # `dashboard/client.py` imports `requests` for its exception tree — it
        # catches `RequestException` and types a `Response` — while making
        # every request through `HttpClient`, and a rule that banned the import
        # would be asking it to catch exceptions it cannot name. So the call
        # sites are what is forbidden. The transports that have no
        # exception-only use are still banned outright by import.
        run: |
          set -e
          calls=$(grep -rEn '\b(requests\.(get|post|put|patch|delete|head|request|Session)|urlopen)[[:space:]]*\(' \
                  src api dashboard | grep -v '^src/utils/http.py' || true)
          if [ -n "$calls" ]; then
            echo "an HTTP call is made outside src/utils/http:"; echo "$calls"; exit 1
          fi
          transports=$(grep -rEn '^[[:space:]]*(import|from) (urllib|http\.client|socket)\b' \
                       src api dashboard | grep -v '^src/utils/http.py' || true)
          if [ -n "$transports" ]; then
            echo "a raw transport is imported outside src/utils/http:"; echo "$transports"; exit 1
          fi
          echo "outbound HTTP confined to src/utils/http"

  image:
    name: Serving image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Dockerfile is deployment code, and deployment code that is only
      # ever built by hand is deployment code that is broken on the morning it
      # is needed. Its own job, because it is minutes rather than seconds and
      # nothing else in this workflow waits on it.
      - name: Build
        run: docker build --target runtime -t match-outcome-predictor:ci .

      - name: It starts with no data, reports degraded, and says what is missing
        # The clean-checkout state, which is exactly what this image is: no
        # artefact and no tables are copied into it, both are mounted. A
        # container that refused to start here would be one nobody could try
        # before building three hundred thousand rows of football.
        run: |
          set -e
          docker run -d --name api -p 8000:8000 match-outcome-predictor:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          health=$(curl -fsS http://127.0.0.1:8000/health)
          echo "$health"
          echo "$health" | grep -q '"status":"degraded"'
          curl -fsS http://127.0.0.1:8000/version | grep -q '"prediction_log":"disabled"'
          curl -fsS http://127.0.0.1:8000/openapi.json | grep -q '/predict/batch'
          # The limitations have to be reachable from the service itself, not
          # only from a document in a repository nobody serving it has open.
          curl -fsS http://127.0.0.1:8000/model-card/limitations | grep -q 'Betting'
          test "$(docker inspect -f '{{.Config.User}}' match-outcome-predictor:ci)" = "app"
          docker rm -f api

      - name: Build the dashboard
        # Milestone 12. Its own stage in the same Dockerfile, and worth
        # building here for the reason the serving image is: deployment code
        # that is only ever built by hand is broken on the morning it is
        # needed.
        run: docker build --target dashboard -t match-outcome-dashboard:ci .

      - name: It starts with no data and answers its health endpoint
        # The clean-checkout state again. The dashboard reads report tables
        # that are not in the image, so this is the empty-state page — which is
        # exactly what a new reader sees first, and it must render rather than
        # stack-trace.
        run: |
          set -e
          docker run -d --name dash -p 8501:8501 match-outcome-dashboard:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$(curl -fsS http://127.0.0.1:8501/_stcore/health)" = "ok"
          curl -fsS http://127.0.0.1:8501/ >/dev/null
          test "$(docker inspect -f '{{.Config.User}}' match-outcome-dashboard:ci)" = "app"
          # The layering rule, asserted against the image rather than the
          # source: a dashboard that shipped the handlers could import them.
          if docker run --rm --entrypoint sh match-outcome-dashboard:ci -c 'test -d /app/api'; then
            echo "the dashboard image contains the api package"; exit 1
          fi
          # The theme is a file Streamlit reads from the working directory. An
          # image without it renders light chrome around a dark-first page —
          # a defect that never appears locally, which is exactly the kind
          # worth a line in CI.
          docker run --rm --entrypoint sh match-outcome-dashboard:ci \
            -c 'grep -q "base = \"dark\"" /app/.streamlit/config.toml'
          docker rm -f dash
          echo "dashboard starts, is healthy, themed, runs as app, and has no api package"

      - name: The compose file is valid
        run: docker compose config --quiet
