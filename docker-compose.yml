# The deployment, reproduced locally: the API, and the PostgreSQL it writes
# served predictions to.
#
#   make model            # fit the artefact into ./models (needs the tables)
#   docker compose up     # API http://localhost:8000/docs
#                         # dashboard http://localhost:8501
#
# `data/` and `models/` are mounted read-only rather than copied into the
# image. Retraining is then `make model` and a restart, instead of a rebuild,
# and the image stays the same bytes across every model it serves.
#
# NOT A PRODUCTION DEPLOYMENT. The password below is a literal, there is no
# TLS, and the database port is published to the host. It is a local
# reproduction — see SECURITY.md. A real deployment supplies
# PREDICTION_LOG_DSN from a secret store, publishes nothing but the API, and
# terminates TLS in front of it.

name: match-outcome-predictor

services:
  api:
    build:
      context: .
      target: runtime
    image: match-outcome-predictor:local
    ports:
      - "8000:8000"
    environment:
      # A DSN, not a set of PG* variables. One string is one thing to inject
      # from a secret store, and the code has one setting to read.
      PREDICTION_LOG_DSN: postgresql://predictor:predictor@postgres:5432/predictions
      LOG_LEVEL: INFO
      API_MAX_BATCH: "50"
    volumes:
      # Read-only, both of them. The service reads a feature table and an
      # artefact and writes neither, and a container that cannot corrupt its
      # own inputs is one restart away from healthy whatever else goes wrong.
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        # `service_healthy`, not `service_started`. The API creates its table at
        # startup, so a database that is merely *running* — Postgres runs an
        # init pass before it accepts connections — would fail the first boot
        # and rely on the restart policy to paper over it.
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    image: match-outcome-predictor-dashboard:local
    ports:
      - "8501:8501"
    environment:
      # By service name, not by localhost. The dashboard asks the API for a
      # probability over the compose network, which is the whole reason the URL
      # is a setting rather than a literal in the page.
      DASHBOARD_API_URL: http://api:8000
      # Which fixture feed supplies today, upcoming and live. `none` answers
      # nothing on purpose: this project ingests results, so a match that has
      # not been played is in no table here.
      #
      # Milestone 13 registered `football-data.org` beside it. Selecting it is
      # this line plus a key in the environment — from a secret store, never
      # from this file, which is committed. The variable is passed through
      # empty by default so the container behaves like a fresh checkout: the
      # provider says which variable to set instead of failing to start.
      DASHBOARD_FIXTURE_PROVIDER: ${DASHBOARD_FIXTURE_PROVIDER:-none}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      LOG_LEVEL: INFO
    volumes:
      # Read-only, and only `data/`. The dashboard reads report tables and
      # never the artefact — it asks the service for a probability instead — so
      # `models/` is not mounted here at all.
      - ./data:/app/data:ro
    depends_on:
      api:
        # `service_healthy`, so the predict tab has something to talk to on the
        # first page load rather than showing its "not answering" state for the
        # twenty seconds the API takes to index three hundred thousand
        # fixtures. The page degrades correctly either way; this is about not
        # showing a new reader a warning that is about to stop being true.
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: predictor
      POSTGRES_PASSWORD: predictor
      POSTGRES_DB: predictions
    ports:
      # Published so `make test-int` and psql can reach it from the host. Bound
      # to localhost explicitly: the unqualified form listens on every
      # interface, which on a laptop on a café network is a database on the
      # internet with the password in this file.
      - "127.0.0.1:5432:5432"
    volumes:
      - predictions:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor -d predictions"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  predictions:
